name: Taskty
description: >-
  Taskty (تاسكتى) is an Egypt-based online marketplace for on-demand home
  services, connecting customers with vetted service providers for residential
  cleaning, furniture and upholstery care, eco-friendly pest control, and home
  maintenance including plumbing, electrical, painting, carpentry, marble,
  aluminum, and air-conditioning work. The platform is delivered primarily
  through consumer iOS and Android mobile apps plus a web presence, with
  booking, dispatch, and WhatsApp/phone support. Surfaced as a portfolio company
  of 500 Global and added to the API Evangelist network. As of this enrichment
  pass Taskty publishes no public developer portal, API documentation, or
  machine-readable API surface.
